<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- 移动端优化 -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#4a6fa5">
    
    <title>双人共享日历</title>
    
    <!-- FullCalendar CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css">
    
    <!-- Font Awesome 图标 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* 基础样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
            background: #f5f7fa;
            color: #333;
            line-height: 1.6;
        }
        
        .app-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* 头部样式 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #ddd;
            margin-bottom: 20px;
        }
        
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #4a6fa5;
        }
        
        .view-tabs {
            display: flex;
            gap: 10px;
        }
        
        .tab-btn {
            padding: 8px 16px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }
        
        .tab-btn.active {
            background: #4a6fa5;
            color: white;
            border-color: #4a6fa5;
        }
        
        .tab-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        /* 按钮样式 */
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
            font-size: 14px;
        }
        
        .btn-primary {
            background: #4a6fa5;
            color: white;
        }
        
        .btn-primary:hover {
            background: #166088;
            transform: translateY(-2px);
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        
        .btn-success {
            background: #28a745;
            color: white;
        }
        
        .btn-success:hover {
            background: #218838;
        }
        
        /* 用户标识 */
        .user-badges {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .user-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 15px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .user-color {
            width: 20px;
            height: 20px;
            border-radius: 50%;
        }
        
        .user-name {
            font-weight: 500;
        }
        
        /* 主内容区 */
        .main-content {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
        }
        
        /* 侧边栏 */
        .sidebar {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }
        
        .sidebar h3 {
            margin-bottom: 15px;
            color: #4a6fa5;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        /* 日历容器 */
        .calendar-container {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }
        
        #calendar {
            height: 600px;
        }
        
        /* 事件表单 */
        .event-form {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.2);
            z-index: 1000;
            min-width: 400px;
            max-width: 90%;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #555;
        }
        
        .form-control {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border 0.3s;
        }
        
        .form-control:focus {
            outline: none;
            border-color: #4a6fa5;
            box-shadow: 0 0 0 3px rgba(74, 111, 165, 0.1);
        }
        
        /* 空闲时间段 */
        .free-time-slots {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        
        .slot-item {
            padding: 12px;
            margin: 8px 0;
            background: #d4edda;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #28a745;
        }
        
        /* 消息提示 */
        .message {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            border-radius: 8px;
            color: white;
            z-index: 10000;
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
            animation: slideIn 0.3s ease;
            max-width: 300px;
        }
        
        .message.success {
            background: #28a745;
        }
        
        .message.info {
            background: #4a6fa5;
        }
        
        .message.warning {
            background: #ffc107;
            color: #333;
        }
        
        /* 遮罩层 */
        #overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 999;
        }
        
        /* 动画 */
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        @keyframes slideOut {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100%); opacity: 0; }
        }
        
        /* 移动端响应式 */
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .header {
                flex-direction: column;
                gap: 15px;
            }
            
            .view-tabs {
                width: 100%;
                justify-content: center;
            }
            
            .event-form {
                min-width: 90%;
                padding: 20px;
            }
            
            #calendar {
                height: 500px;
            }
        }
        
        /* 今日事件列表 */
        .today-event {
            padding: 10px;
            margin: 8px 0;
            background: #f8f9fa;
            border-radius: 6px;
            border-left: 3px solid #4a6fa5;
        }
        
        .today-event .time {
            font-weight: bold;
            color: #4a6fa5;
            margin-bottom: 3px;
        }
        
        .today-event .title {
            margin-bottom: 3px;
        }
        
        .today-event .location {
            font-size: 12px;
            color: #666;
        }
        
        /* 分享链接区域 */
        .share-area {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }
        
        .share-hint {
            margin-top: 10px;
            padding: 10px;
            background: #e7f3ff;
            border-radius: 6px;
            font-size: 14px;
            color: #166088;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 顶部导航 -->
        <header class="header">
            <div class="logo" id="page-title">
                <i class="fas fa-calendar-alt"></i> 双人共享日历
            </div>
            
            <div class="view-tabs">
                <button class="tab-btn active" onclick="switchView('personal')">
                    <i class="fas fa-user"></i> 我的日程
                </button>
                <button class="tab-btn" onclick="switchView('shared')">
                    <i class="fas fa-users"></i> 共享视图
                </button>
                <button class="tab-btn" onclick="switchView('availability')">
                    <i class="fas fa-clock"></i> 共同空闲
                </button>
            </div>
            
            <button class="btn btn-primary" onclick="showEventForm()">
                <i class="fas fa-plus"></i> 添加事件
            </button>
        </header>
        
        <!-- 用户标识 -->
        <div class="user-badges">
            <div class="user-badge">
                <div class="user-color" style="background: #4a6fa5;"></div>
                <span class="user-name" id="user1-name">我</span>
            </div>
            <div class="user-badge">
                <div class="user-color" style="background: #e85d75;"></div>
                <span class="user-name" id="user2-name">伙伴</span>
            </div>
        </div>
        
        <!-- 主内容区 -->
        <div class="main-content">
            <!-- 侧边栏 -->
            <aside class="sidebar">
                <h3><i class="fas fa-tasks"></i> 今日日程</h3>
                <div id="today-events">
                    <div style="text-align: center; padding: 20px; color: #999;">
                        今天没有安排
                    </div>
                </div>
                
                <!-- 共同空闲时间 -->
                <div id="free-time-container" style="display: none; margin-top: 25px;">
                    <h3><i class="fas fa-check-circle"></i> 共同空闲时间</h3>
                    <div id="free-time-slots"></div>
                </div>
                
                <!-- 分享链接 -->
                <div class="share-area">
                    <h3><i class="fas fa-share-alt"></i> 邀请伙伴</h3>
                    <p style="margin-bottom: 10px; font-size: 14px; color: #666;">
                        发送下方链接给伙伴，对方打开即可共享日历
                    </p>
                    
                    <div class="form-group">
                        <input type="text" id="share-link" class="form-control" readonly 
                               value="正在生成链接..." style="margin-bottom: 10px;">
                        
                        <div style="display: flex; gap: 10px;">
                            <button class="btn btn-primary" onclick="copyShareLink()" style="flex: 1;">
                                <i class="fas fa-copy"></i> 复制链接
                            </button>
                            <button class="btn btn-success" onclick="sendShareLink()" style="flex: 1;">
                                <i class="fas fa-paper-plane"></i> 发送
                            </button>
                        </div>
                    </div>
                    
                    <div class="share-hint" id="share-hint">
                        <i class="fas fa-info-circle"></i>
                        您是日历创建者，可以邀请一位伙伴共享日历
                    </div>
                </div>
            </aside>
            
            <!-- 日历主体 -->
            <main class="calendar-container">
                <div id="calendar"></div>
            </main>
        </div>
    </div>
    
    <!-- 事件表单模态框 -->
    <div id="event-form" class="event-form">
        <h3 style="margin-bottom: 20px; color: #4a6fa5;">
            <i class="fas fa-calendar-plus"></i> 添加事件
        </h3>
        
        <form id="eventForm" onsubmit="return false;">
            <div class="form-group">
                <label for="event-title">事件标题 *</label>
                <input type="text" id="event-title" class="form-control" required placeholder="例如：团队会议">
            </div>
            
            <div class="form-group">
                <label for="event-date">日期 *</label>
                <input type="date" id="event-date" class="form-control" required>
            </div>
            
            <div class="form-group">
                <label for="start-time">开始时间 *</label>
                <input type="time" id="start-time" class="form-control" required>
            </div>
            
            <div class="form-group">
                <label for="end-time">结束时间 *</label>
                <input type="time" id="end-time" class="form-control" required>
            </div>
            
            <div class="form-group">
                <label for="event-location">地点（可选）</label>
                <input type="text" id="event-location" class="form-control" placeholder="例如：会议室A 或 Zoom链接">
            </div>
            
            <div class="form-group">
                <label for="event-user">参与方 *</label>
                <select id="event-user" class="form-control">
                    <option value="user1">仅我自己</option>
                    <option value="user2">仅伙伴</option>
                    <option value="both" selected>双方参与</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="event-repeat">重复</label>
                <select id="event-repeat" class="form-control">
                    <option value="none" selected>不重复</option>
                    <option value="daily">每天</option>
                    <option value="weekly">每周</option>
                    <option value="monthly">每月</option>
                </select>
            </div>
            
            <div style="display: flex; gap: 10px; margin-top: 25px;">
                <button type="button" class="btn btn-primary" style="flex: 1;" onclick="saveEvent()">
                    <i class="fas fa-save"></i> 保存事件
                </button>
                <button type="button" class="btn" style="flex: 1; background: #f8f9fa;" 
                        onclick="hideEventForm()">
                    <i class="fas fa-times"></i> 取消
                </button>
            </div>
        </form>
    </div>
    
    <!-- 遮罩层 -->
    <div id="overlay" onclick="hideEventForm()"></div>

    <!-- 引入JS库 -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/locales/zh-cn.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.7/dayjs.min.js"></script>
    
    <!-- 主JavaScript代码 -->
    <script>
        // ==================== 全局变量 ====================
        let calendar;
        let events = [];
        let currentUser = 'user1'; // 默认是创建者
        
        // ==================== 页面初始化 ====================
        document.addEventListener('DOMContentLoaded', function() {
            console.log('双人共享日历初始化...');
            
            // 1. 初始化用户身份
            initUserIdentity();
            
            // 2. 初始化日历
            initCalendar();
            
            // 3. 加载事件
            loadEvents();
            
            // 4. 更新今日事件
            updateTodayEvents();
            
            // 5. 设置表单默认值
            setupFormDefaults();
            
            // 6. 生成分享链接
            generateShareLink();
            
            console.log('初始化完成，当前用户:', currentUser);
        });
        
        // ==================== 用户身份管理 ====================
        function initUserIdentity() {
            // 检查URL参数
            const urlParams = new URLSearchParams(window.location.search);
            
            if (urlParams.has('partner')) {
                // 通过分享链接访问的是伙伴
                currentUser = 'user2';
                localStorage.setItem('isPartner', 'true');
                console.log('检测到分享链接，设置为伙伴角色');
            } else if (localStorage.getItem('isPartner') === 'true') {
                // 之前已经是伙伴
                currentUser = 'user2';
                console.log('从本地存储恢复伙伴角色');
            } else {
                // 默认是创建者
                currentUser = 'user1';
                localStorage.removeItem('isPartner');
            }
            
            // 保存当前用户
            localStorage.setItem('currentUser', currentUser);
            
            // 更新UI
            updateUIForUserRole();
        }
        
        function updateUIForUserRole() {
            const isPartner = currentUser === 'user2';
            
            // 更新页面标题
            const pageTitle = document.getElementById('page-title');
            if (isPartner) {
                pageTitle.innerHTML = '<i class="fas fa-calendar-alt"></i> 共享日历（伙伴）';
            } else {
                pageTitle.innerHTML = '<i class="fas fa-calendar-alt"></i> 双人共享日历';
            }
            
            // 更新用户标识
            const user1Name = document.getElementById('user1-name');
            const user2Name = document.getElementById('user2-name');
            
            if (isPartner) {
                // 伙伴视角：左-创建者，右-我
                user1Name.textContent = '创建者';
                user2Name.textContent = '我';
            } else {
                // 创建者视角：左-我，右-伙伴
                user1Name.textContent = '我';
                user2Name.textContent = '伙伴';
            }
            
            // 更新分享提示
            const shareHint = document.getElementById('share-hint');
            if (isPartner) {
                shareHint.innerHTML = '<i class="fas fa-check-circle" style="color: #28a745;"></i> 您已作为伙伴加入共享日历';
                shareHint.style.color = '#28a745';
            } else {
                shareHint.innerHTML = '<i class="fas fa-info-circle"></i> 您是日历创建者，可以邀请一位伙伴共享日历';
                shareHint.style.color = '#166088';
            }
        }
        
        // ==================== 日历初始化 ====================
        function initCalendar() {
            const calendarEl = document.getElementById('calendar');
            
            calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'timeGridWeek',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek,timeGridDay'
                },
                locale: 'zh-cn',
                slotMinTime: '08:00',
                slotMaxTime: '22:00',
                slotDuration: '00:30:00',
                allDaySlot: false,
                editable: true,
                selectable: true,
                selectMirror: true,
                dayMaxEvents: true,
                
                // 点击空白处添加事件
                select: function(info) {
                    showEventForm();
                    document.getElementById('event-date').value = info.startStr.split('T')[0];
                    document.getElementById('start-time').value = formatTime(info.start);
                    document.getElementById('end-time').value = formatTime(info.end);
                },
                
                // 点击事件查看详情
                eventClick: function(info) {
                    const event = info.event;
                    const message = `
                        <strong>${event.title}</strong><br>
                        时间: ${formatTime(event.start)} - ${formatTime(event.end)}<br>
                        ${event.extendedProps.location ? '地点: ' + event.extendedProps.location + '<br>' : ''}
                        参与方: ${getParticipantText(event.extendedProps.user)}
                    `;
                    
                    if (confirm('要编辑这个事件吗？\n\n点击"确定"编辑，点击"取消"查看详情')) {
                        editEvent(event);
                    } else {
                        alert(message);
                    }
                },
                
                // 拖拽调整时间
                eventDrop: function(info) {
                    updateEventInStorage(info.event);
                    showMessage('事件时间已更新', 'success');
                },
                
                // 调整持续时间
                eventResize: function(info) {
                    updateEventInStorage(info.event);
                    showMessage('事件时长已更新', 'success');
                },
                
                // 加载事件到日历
                events: function(fetchInfo, successCallback) {
                    const filteredEvents = getFilteredEvents(fetchInfo.start, fetchInfo.end);
                    successCallback(filteredEvents);
                },
                
                // 事件渲染后的样式
                eventDidMount: function(info) {
                    const user = info.event.extendedProps.user;
                    let color = '#4a6fa5'; // 默认蓝色
                    
                    if (user === 'user1') {
                        color = '#4a6fa5'; // 蓝色 - 用户1
                    } else if (user === 'user2') {
                        color = '#e85d75'; // 红色 - 用户2
                    } else if (user === 'both') {
                        color = '#6c5ce7'; // 紫色 - 双方
                    }
                    
                    info.el.style.backgroundColor = color;
                    info.el.style.borderColor = color;
                    info.el.style.color = 'white';
                }
            });
            
            calendar.render();
            console.log('日历初始化完成');
        }
        
        // ==================== 事件管理 ====================
        function loadEvents() {
            const saved = localStorage.getItem('sharedCalendarEvents');
            if (saved) {
                events = JSON.parse(saved);
                console.log('加载了', events.length, '个事件');
            } else {
                events = [];
                console.log('没有找到保存的事件');
            }
        }
        
        function saveEvents() {
            localStorage.setItem('sharedCalendarEvents', JSON.stringify(events));
            localStorage.setItem('lastUpdate', Date.now().toString());
        }
        
        function getFilteredEvents(start, end) {
            // 根据当前视图过滤事件
            const viewType = document.querySelector('.tab-btn.active').textContent;
            
            return events.filter(event => {
                const eventStart = new Date(event.start);
                const eventEnd = new Date(event.end);
                
                // 时间范围过滤
                if (eventEnd < start || eventStart > end) return false;
                
                // 视图过滤
                if (viewType.includes('我的')) {
                    // 我的日程：只看自己的和双方的事件
                    return event.user === currentUser || event.user === 'both';
                } else if (viewType.includes('伙伴')) {
                    // 共享视图：看所有事件
                    return true;
                }
                
                return true;
            }).map(event => ({
                id: event.id,
                title: event.title + (event.location ? ` (${event.location})` : ''),
                start: event.start,
                end: event.end,
                extendedProps: {
                    user: event.user,
                    location: event.location || '',
                    repeat: event.repeat || 'none'
                }
            }));
        }
        
        // ==================== 事件表单操作 ====================
        function showEventForm() {
            document.getElementById('event-form').style.display = 'block';
            document.getElementById('overlay').style.display = 'block';
        }
        
        function hideEventForm() {
            document.getElementById('event-form').style.display = 'none';
            document.getElementById('overlay').style.display = 'none';
        }
        
        function setupFormDefaults() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('event-date').value = today;
            
            // 设置默认时间为下一整点
            const now = new Date();
            const nextHour = new Date(now.getTime() + 60 * 60 * 1000);
            nextHour.setMinutes(0, 0, 0);
            
            document.getElementById('start-time').value = formatTime(nextHour);
            
            // 结束时间设为开始时间后1小时
            const endTime = new Date(nextHour.getTime() + 60 * 60 * 1000);
            document.getElementById('end-time').value = formatTime(endTime);
            
            // 默认参与方根据当前用户
            if (currentUser === 'user2') {
                document.getElementById('event-user').value = 'user2';
            }
        }
        
        function saveEvent() {
            // 获取表单数据
            const title = document.getElementById('event-title').value.trim();
            const date = document.getElementById('event-date').value;
            const startTime = document.getElementById('start-time').value;
            const endTime = document.getElementById('end-time').value;
            const location = document.getElementById('event-location').value.trim();
            const user = document.getElementById('event-user').value;
            const repeat = document.getElementById('event-repeat').value;
            
            // 验证数据
            if (!title) {
                showMessage('请输入事件标题', 'warning');
                document.getElementById('event-title').focus();
                return;
            }
            
            if (!date) {
                showMessage('请选择日期', 'warning');
                return;
            }
            
            if (!startTime || !endTime) {
                showMessage('请选择时间', 'warning');
                return;
            }
            
            if (startTime >= endTime) {
                showMessage('结束时间必须晚于开始时间', 'warning');
                return;
            }
            
            // 创建事件对象
            const event = {
                id: 'event_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9),
                title: title,
                start: date + 'T' + startTime,
                end: date + 'T' + endTime,
                location: location,
                user: user,
                repeat: repeat,
                createdAt: new Date().toISOString(),
                createdBy: currentUser
            };
            
            // 保存事件
            events.push(event);
            saveEvents();
            
            // 更新日历显示
            calendar.refetchEvents();
            
            // 更新今日事件
            updateTodayEvents();
            
            // 隐藏表单
            hideEventForm();
            
            // 显示成功消息
            showMessage(`"${title}" 已保存`, 'success');
            
            // 重置表单
            document.getElementById('eventForm').reset();
            setupFormDefaults();
        }
        
        function editEvent(eventObj) {
            // 在事件数组中查找该事件
            const eventId = eventObj.id;
            const event = events.find(e => e.id === eventId);
            
            if (!event) {
                showMessage('未找到该事件', 'warning');
                return;
            }
            
            // 填充表单
            document.getElementById('event-title').value = event.title;
            document.getElementById('event-date').value = event.start.split('T')[0];
            document.getElementById('start-time').value = event.start.split('T')[1].substring(0, 5);
            document.getElementById('end-time').value = event.end.split('T')[1].substring(0, 5);
            document.getElementById('event-location').value = event.location || '';
            document.getElementById('event-user').value = event.user;
            document.getElementById('event-repeat').value = event.repeat || 'none';
            
            // 显示编辑表单
            showEventForm();
            
            // 修改保存按钮行为
            const saveBtn = document.querySelector('#event-form .btn-primary');
            const originalOnclick = saveBtn.onclick;
            
            saveBtn.onclick = function() {
                // 更新事件
                event.title = document.getElementById('event-title').value.trim();
                event.start = document.getElementById('event-date').value + 'T' + document.getElementById('start-time').value;
                event.end = document.getElementById('event-date').value + 'T' + document.getElementById('end-time').value;
                event.location = document.getElementById('event-location').value.trim();
                event.user = document.getElementById('event-user').value;
                event.repeat = document.getElementById('event-repeat').value;
                
                // 保存并更新
                saveEvents();
                calendar.refetchEvents();
                updateTodayEvents();
                hideEventForm();
                showMessage(`"${event.title}" 已更新`, 'success');
                
                // 恢复原点击事件
                saveBtn.onclick = originalOnclick;
                
                // 重置表单默认值
                setupFormDefaults();
            };
        }
        
        function updateEventInStorage(eventObj) {
            const eventId = eventObj.id;
            const index = events.findIndex(e => e.id === eventId);
            
            if (index !== -1) {
                events[index].start = eventObj.start.toISOString();
                events[index].end = eventObj.end.toISOString();
                saveEvents();
            }
        }
        
        // ==================== 视图切换 ====================
        function switchView(viewType) {
            // 更新标签状态
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // 显示/隐藏空闲时间
            const freeTimeContainer = document.getElementById('free-time-container');
            if (viewType === 'availability') {
                freeTimeContainer.style.display = 'block';
                findCommonAvailability();
            } else {
                freeTimeContainer.style.display = 'none';
            }
            
            // 重新加载事件
            calendar.refetchEvents();
        }
        
        // ==================== 共同空闲时间 ====================
        function findCommonAvailability() {
            const today = new Date();
            const todayStr = today.toISOString().split('T')[0];
            
            // 获取今天的事件
            const todayEvents = events.filter(event => {
                return event.start.startsWith(todayStr);
            });
            
            // 这里简化处理，实际应该计算双方的空闲时间
            // 为了演示，我们显示几个示例时间段
            const exampleSlots = [
                { start: '10:00', end: '11:30', duration: 90 },
                { start: '14:00', end: '15:00', duration: 60 },
                { start: '16:00', end: '17:30', duration: 90 }
            ];
            
            const container = document.getElementById('free-time-slots');
            container.innerHTML = '';
            
            if (exampleSlots.length === 0) {
                container.innerHTML = '<p style="color: #666; text-align: center; padding: 20px;">今天没有共同空闲时间</p>';
                return;
            }
            
            exampleSlots.forEach(slot => {
                const slotEl = document.createElement('div');
                slotEl.className = 'slot-item';
                slotEl.innerHTML = `
                    <div>
                        <strong>${slot.start} - ${slot.end}</strong>
                        <div style="font-size: 12px; color: #555;">${slot.duration} 分钟可用</div>
                    </div>
                    <button class="btn btn-success" onclick="bookSlot('${slot.start}', '${slot.end}')" style="padding: 5px 10px; font-size: 12px;">
                        预定
                    </button>
                `;
                container.appendChild(slotEl);
            });
        }
        
        function bookSlot(start, end) {
            const today = new Date().toISOString().split('T')[0];
            
            document.getElementById('event-date').value = today;
            document.getElementById('start-time').value = start;
            document.getElementById('end-time').value = end;
            document.getElementById('event-user').value = 'both';
            
            showEventForm();
        }
        
        // ==================== 今日事件 ====================
        function updateTodayEvents() {
            const today = new Date().toDateString();
            const todayEvents = events.filter(event => {
                const eventDate = new Date(event.start).toDateString();
                return eventDate === today;
            }).sort((a, b) => new Date(a.start) - new Date(b.start));
            
            const container = document.getElementById('today-events');
            
            if (todayEvents.length === 0) {
                container.innerHTML = '<div style="text-align: center; padding: 20px; color: #999;">今天没有安排</div>';
                return;
            }
            
            let html = '';
            todayEvents.forEach(event => {
                const startTime = formatTime(event.start);
                const endTime = formatTime(event.end);
                const userColor = event.user === 'user1' ? '#4a6fa5' : 
                                 event.user === 'user2' ? '#e85d75' : '#6c5ce7';
                
                html += `
                    <div class="today-event" style="border-left-color: ${userColor}">
                        <div class="time">${startTime} - ${endTime}</div>
                        <div class="title">${event.title}</div>
                        ${event.location ? `<div class="location">📍 ${event.location}</div>` : ''}
                        <div style="font-size: 11px; color: #888; margin-top: 3px;">
                            ${getParticipantText(event.user)}
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        // ==================== 分享功能 ====================
        function generateShareLink() {
            const baseUrl = window.location.origin + window.location.pathname;
            
            // 清理现有参数
            let cleanUrl = baseUrl;
            if (cleanUrl.includes('?')) {
                cleanUrl = cleanUrl.split('?')[0];
            }
            
            // 生成固定分享链接
            const shareUrl = cleanUrl + '?partner';
            
            document.getElementById('share-link').value = shareUrl;
            return shareUrl;
        }
        
        function copyShareLink() {
            const shareUrl = generateShareLink();
            
            // 使用现代Clipboard API
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(shareUrl).then(() => {
                    showMessage('✅ 链接已复制！发送给伙伴即可。', 'success');
                }).catch(err => {
                    console.error('复制失败:', err);
                    copyFallback(shareUrl);
                });
            } else {
                copyFallback(shareUrl);
            }
        }
        
        function copyFallback(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            
            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    showMessage('✅ 链接已复制！发送给伙伴即可。', 'success');
                } else {
                    prompt('请手动复制链接：', text);
                }
            } catch (err) {
                prompt('请手动复制链接：', text);
            }
            
            document.body.removeChild(textarea);
        }
        
        function sendShareLink() {
            const shareUrl = generateShareLink();
            const shareText = `📅 邀请您加入双人共享日历\n\n点击链接即可查看和编辑我们的共享日程：\n${shareUrl}\n\n功能特色：\n• 查看双方日程安排\n• 添加/编辑事件\n• 智能查找共同空闲时间\n• 支持重复事件`;
            
            // 如果支持Web Share API
            if (navigator.share) {
                navigator.share({
                    title: '双人共享日历邀请',
                    text: shareText,
                    url: shareUrl
                }).catch(err => {
                    console.log('分享取消或失败:', err);
                    copyShareLink();
                });
            } else {
                // 如果不支持，复制到剪贴板
                copyShareLink();
            }
        }
        
        // ==================== 工具函数 ====================
        function formatTime(date) {
            if (!(date instanceof Date)) {
                date = new Date(date);
            }
            return date.toTimeString().substring(0, 5);
        }
        
        function getParticipantText(user) {
            switch(user) {
                case 'user1': return '👤 仅我自己';
                case 'user2': return '👥 仅伙伴';
                case 'both': return '👥 双方参与';
                default: return '👥 未知';
            }
        }
        
        function showMessage(message, type = 'info') {
            // 移除现有消息
            const existingMessages = document.querySelectorAll('.message');
            existingMessages.forEach(msg => msg.remove());
            
            // 创建新消息
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            messageDiv.textContent = message;
            
            document.body.appendChild(messageDiv);
            
            // 3秒后自动消失
            setTimeout(() => {
                messageDiv.style.animation = 'slideOut 0.3s ease';
                setTimeout(() => {
                    if (messageDiv.parentNode) {
                        document.body.removeChild(messageDiv);
                    }
                }, 300);
            }, 3000);
        }
        
        // ==================== 数据同步（简单轮询） ====================
        function checkForUpdates() {
            const lastUpdate = localStorage.getItem('lastUpdate');
            const lastCheck = localStorage.getItem('lastCheck') || '0';
            
            // 每隔10秒检查一次
            if (Date.now() - parseInt(lastCheck) > 10000) {
                // 如果是伙伴，可以检查是否有新事件
                // 这里简化处理，实际可以添加更复杂的同步逻辑
                const storedEvents = localStorage.getItem('sharedCalendarEvents');
                if (storedEvents) {
                    const parsedEvents = JSON.parse(storedEvents);
                    if (parsedEvents.length !== events.length) {
                        events = parsedEvents;
                        calendar.refetchEvents();
                        updateTodayEvents();
                        console.log('检测到事件更新，已同步');
                    }
                }
                
                localStorage.setItem('lastCheck', Date.now().toString());
            }
        }
        
        // 每5秒检查一次更新
        setInterval(checkForUpdates, 5000);
        
        // ==================== 键盘快捷键 ====================
        document.addEventListener('keydown', function(e) {
            // ESC键关闭表单
            if (e.key === 'Escape') {
                hideEventForm();
            }
            
            // Ctrl/Cmd + N 添加新事件
            if ((e.ctrlKey || e.metaKey) && e.key === 'n') {
                e.preventDefault();
                showEventForm();
            }
        });
        
        // ==================== 页面可见性变化 ====================
        document.addEventListener('visibilitychange', function() {
            if (!document.hidden) {
                // 页面变为可见时，重新加载数据
                loadEvents();
                calendar.refetchEvents();
                updateTodayEvents();
            }
        });
        
        // ==================== 导出/导入功能（可选） ====================
        function exportEvents() {
            const dataStr = JSON.stringify(events, null, 2);
            const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
            
            const exportFileDefaultName = '共享日历备份_' + new Date().toISOString().split('T')[0] + '.json';
            
            const linkElement = document.createElement('a');
            linkElement.setAttribute('href', dataUri);
            linkElement.setAttribute('download', exportFileDefaultName);
            linkElement.click();
        }
        
        function importEvents() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            
            input.onchange = function(e) {
                const file = e.target.files[0];
                const reader = new FileReader();
                
                reader.onload = function(event) {
                    try {
                        const importedEvents = JSON.parse(event.target.result);
                        events = importedEvents;
                        saveEvents();
                        calendar.refetchEvents();
                        updateTodayEvents();
                        showMessage('事件已导入成功！', 'success');
                    } catch (err) {
                        showMessage('导入失败，文件格式错误', 'warning');
                    }
                };
                
                reader.readAsText(file);
            };
            
            input.click();
        }
        
        // ==================== 清空数据（调试用） ====================
        function clearAllData() {
            if (confirm('⚠️ 确定要清空所有数据吗？此操作不可撤销！')) {
                localStorage.clear();
                events = [];
                calendar.refetchEvents();
                updateTodayEvents();
                showMessage('所有数据已清空', 'warning');
                location.reload();
            }
        }
        
        // 在控制台暴露一些有用的函数
        window.debug = {
            exportEvents,
            importEvents,
            clearAllData,
            getEvents: () => events,
            getUser: () => currentUser
        };
        
        console.log('调试命令可用：debug.exportEvents(), debug.importEvents(), debug.clearAllData()');
    </script>
</body>
</html>
